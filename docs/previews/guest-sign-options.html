<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>손님집 간판 시안</title>
<style>
  body { margin: 0; padding: 16px; background: #f4eedf; font-family: sans-serif; color: #4a3a2a; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; }
  figure { margin: 0; background: #fffaf0; border: 2px solid #c9b48f; border-radius: 6px; padding: 8px; }
  figcaption { font-weight: 700; margin-top: 6px; font-size: 15px; }
  figcaption span { display: block; font-weight: 400; font-size: 13px; margin-top: 2px; }
  canvas { display: block; image-rendering: pixelated; width: 240px; height: 240px; }
</style>
</head>
<body>
<h1>손님집 간판 — 네모 테두리 하트</h1>
<div class="row" id="row"></div>
<script>
const mix = (a, b, t) => '#' + [1, 3, 5].map(i => Math.round(parseInt(a.slice(i, i + 2), 16) * (1 - t) + parseInt(b.slice(i, i + 2), 16) * t).toString(16).padStart(2, '0')).join('')
const ROOF = ['#cc70a0', '#b05c88', '#d888b4'], WALL = '#f4e0c0', BASE = '#f0d8b0'
const FRAME = '#c59a61', GLASS = '#ffca70', GLOW = '#ffeaba'
function house(g) {
  const r = (c, x, y, w, h) => { g.fillStyle = c; g.fillRect(x, y, w, h) }
  r('#b0cc94', 0, 0, 64, 64)
  r(WALL, 0, 32, 64, 32); r('rgba(90,60,70,0.22)', 0, 32, 64, 3); r(BASE, 0, 60, 64, 4); r(BASE, 0, 32, 2, 32); r(BASE, 62, 32, 2, 32)
  const [c1, c2, c3] = ROOF
  r(c1, 0, 8, 64, 24); r(mix(c1, c2, .25), 0, 16, 64, 2); r(c2, 0, 8, 64, 4); r(c3, 0, 8, 64, 2); r(c2, 0, 8, 2, 24); r(c2, 62, 8, 2, 24); r(c2, 0, 28, 64, 4); r(mix(c2, '#000000', .15), 0, 30, 64, 2)
  r('#e0a974', 46, 2, 8, 12); r('#9a6e45', 44, 0, 12, 2); r(mix('#e0a974', '#9a6e45', .4), 52, 2, 2, 12)
  for (const wc of [12, 52]) {
    const ox = wc - 8, dy = 49
    r(FRAME, ox + 3, dy, 10, 9); r(GLASS, ox + 4, dy + 1, 8, 7); r(GLOW, ox + 4, dy + 1, 3, 3); r(FRAME, ox + 7, dy + 1, 2, 7); r(FRAME, ox + 4, dy + 4, 8, 1)
    r('#c68b54', ox + 3, 58, 10, 2); for (let i = 0; i < 4; i++) r(['#ffc2a0', '#fefdf8', '#feae88', '#a2cb78'][(wc + i) % 4], ox + 4 + i * 2, 57, 2, 1)
  }
  const dx = 26, door = '#906040'
  r(FRAME, dx, 49, 12, 15); r(door, dx + 1, 50, 10, 14); r(door, dx + 2, 49, 8, 1); r(mix(door, '#000000', .18), dx + 4, 51, 1, 13); r(mix(door, '#000000', .18), dx + 7, 51, 1, 13); r('#ffca70', dx + 8, 57, 2, 2)
  return r
}
/** 네모 테두리 하트 간판 (13×12): 바깥 1도트는 모래색, 안쪽 1도트는 더 연한 색 — 2도트보다 가볍게. bx = 판 왼쪽 */
function heartSign(r, bx, frame, inner) {
  const face = '#f6e6c4', shine = '#fbf1da'
  const top = 35
  r(frame, bx, top, 13, 12)
  r(inner, bx + 1, top + 1, 11, 10)
  r(face, bx + 2, top + 2, 9, 8); r(shine, bx + 2, top + 2, 9, 1)
  const H = ['.##.##.', '#######', '#######', '.#####.', '..###..', '...#...']
  H.forEach((row, y) => [...row].forEach((c, x) => { if (c === '#') r('#d9707e', bx + 3 + x, top + 3 + y, 1, 1) }))
  r('#ffffff', bx + 4, top + 4, 1, 1)
}
const OPTIONS = [
  ['가 · 테두리 2도트 (지금)', '바깥·안쪽 모두 모래색', r => heartSign(r, 46, '#dcbf94', '#dcbf94')],
  ['나 · 한 줄 연하게', '바깥 1도트 모래색, 안쪽 1도트는 연한 색', r => heartSign(r, 46, '#dcbf94', '#ead6b2')],
  ['다 · 테두리 1도트', '바깥 1도트만', r => heartSign(r, 46, '#dcbf94', '#f6e6c4')],
]
const row = document.getElementById('row')
for (const [name, desc, draw] of OPTIONS) {
  const fig = document.createElement('figure')
  const c = document.createElement('canvas'); c.width = 64; c.height = 64
  const g = c.getContext('2d'); const r = house(g); draw(r)
  const cap = document.createElement('figcaption'); cap.innerHTML = `${name}<span>${desc}</span>`
  fig.append(c, cap); row.append(fig)
}
</script>
</body>
</html>
