<!doctype html><html lang="ko"><meta charset="utf-8"><title>27마을 · 작은 생활 도트</title><style>body{font:16px system-ui;background:#f6edda;color:#493729;margin:32px}main{display:flex;flex-wrap:wrap;gap:18px}article{background:#e0d6bd;border-radius:12px;padding:20px;text-align:center;min-width:160px}img{image-rendering:pixelated;height:112px;width:auto;object-fit:contain}button{font:inherit;margin-bottom:20px;padding:8px 16px}small{display:block;margin:12px}</style><h1>27마을 · 작은 생활 도트</h1><p>게임에 연결한 5가지 몸짓과 양의 걸음·풀 먹기. 각 4프레임, 투명 PNG.</p><button id="toggle">모션 멈추기</button><main><article><h3>입 가리고 하품</h3><img data-i="0" src="yawn-0.png" alt="입 가리고 하품"><small>4프레임 · 250ms</small></article><article><h3>손목 풀기</h3><img data-i="1" src="wrist-0.png" alt="손목 풀기"><small>4프레임 · 250ms</small></article><article><h3>기지개</h3><img data-i="2" src="stretch-0.png" alt="기지개"><small>4프레임 · 250ms</small></article><article><h3>흥얼거리기</h3><img data-i="3" src="hum-0.png" alt="흥얼거리기"><small>4프레임 · 250ms</small></article><article><h3>손 흔들기</h3><img data-i="4" src="wave-0.png" alt="손 흔들기"><small>4프레임 · 250ms</small></article><article><h3>양 걷기 · left</h3><img data-i="5" src="sheep-walk-left-0.png" alt="양 걷기 · left"><small>4프레임 · 250ms</small></article><article><h3>양 풀 먹기 · left</h3><img data-i="6" src="sheep-graze-left-0.png" alt="양 풀 먹기 · left"><small>4프레임 · 250ms</small></article><article><h3>양 걷기 · right</h3><img data-i="7" src="sheep-walk-right-0.png" alt="양 걷기 · right"><small>4프레임 · 250ms</small></article><article><h3>양 풀 먹기 · right</h3><img data-i="8" src="sheep-graze-right-0.png" alt="양 풀 먹기 · right"><small>4프레임 · 250ms</small></article></main><script>const seq=[["yawn-0.png","yawn-1.png","yawn-2.png","yawn-3.png"],["wrist-0.png","wrist-1.png","wrist-2.png","wrist-3.png"],["stretch-0.png","stretch-1.png","stretch-2.png","stretch-3.png"],["hum-0.png","hum-1.png","hum-2.png","hum-3.png"],["wave-0.png","wave-1.png","wave-2.png","wave-3.png"],["sheep-walk-left-0.png","sheep-walk-left-1.png","sheep-walk-left-2.png","sheep-walk-left-3.png"],["sheep-graze-left-0.png","sheep-graze-left-1.png","sheep-graze-left-2.png","sheep-graze-left-3.png"],["sheep-walk-right-0.png","sheep-walk-right-1.png","sheep-walk-right-2.png","sheep-walk-right-3.png"],["sheep-graze-right-0.png","sheep-graze-right-1.png","sheep-graze-right-2.png","sheep-graze-right-3.png"]];let f=0,playing=true;document.getElementById('toggle').onclick=function(){playing=!playing;this.textContent=playing?'모션 멈추기':'모션 재생'};setInterval(()=>{if(!playing)return;f=(f+1)%4;document.querySelectorAll('img').forEach(img=>img.src=seq[Number(img.dataset.i)][f])},250)</script></html>
