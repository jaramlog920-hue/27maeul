<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>27마을 소모임·작은 행사 모션</title><style>*{box-sizing:border-box}body{margin:0;background:#edf0df;color:#59452f;font:16px/1.6 sans-serif}header{padding:24px 28px 12px;max-width:1100px;margin:auto}h1{margin:0;font-size:25px}p{margin:6px 0 16px;color:#75654b}nav{display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:sticky;top:0;background:#edf0df;padding:12px 28px;border-bottom:2px solid #c5b896;z-index:1}nav>div{max-width:1044px;margin:auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap;width:100%}button,select{font:inherit;background:#fff8e9;color:#59452f;border:2px solid #bea67d;border-radius:5px;padding:6px 10px}button{cursor:pointer}main{max-width:1100px;padding:18px 28px 32px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}article{border:2px solid #c8b894;background:#fff9ec;border-radius:8px;padding:12px;text-align:center}h2{font-size:16px;margin:0 0 8px}canvas{image-rendering:pixelated;width:144px;height:144px;background:#f4e0c0;display:block;margin:0 auto;border-radius:3px}small{display:block;color:#8b785e;margin-top:6px}.hint{font-size:13px;margin-bottom:0}</style><header><h1>소모임·작은 행사 모션 미리보기</h1><p>새로 만든 동작 13개입니다. 각 그림은 게임과 같은 도트 크기·팔레트를 사용합니다.</p></header><nav><div><label>캐릭터 <select id="age"><option value="motions">성인</option><option value="children">어린이</option></select></label><label>방향 <select id="direction"><option value="right">오른쪽</option><option value="left">왼쪽</option><option value="down">정면</option><option value="up">뒷모습</option></select></label><button id="play">일시정지</button><button id="next">다음 프레임</button><span id="frame">1 / 4</span></div></nav><main></main><script>const actions=[["pourTea","차 따르기"],["sipTea","찻잔 들어 마시기"],["stitch","바느질"],["showWork","완성한 천 보여주기"],["point","발견한 곳 가리키기"],["takeNote","관찰 내용 메모"],["plant","씨앗 심기"],["waterPlants","물주기"],["greet","손님 맞이 인사"],["offerGift","선물 건네기"],["receiveGift","선물 받아 살펴보기"],["inspectWork","작품 살펴보기"],["wipeTable","탁자 닦기"]];let generation=0,playing=true,phase=0;const sequence=[0,1,2,3,3,2,1,0],cards=[];const main=document.querySelector('main');for(const[id,label]of actions){const article=document.createElement('article'),title=document.createElement('h2'),canvas=document.createElement('canvas'),small=document.createElement('small');title.textContent=label;canvas.width=canvas.height=24;canvas.setAttribute('role','img');canvas.setAttribute('aria-label',label+' 모션');small.textContent='4프레임 · 실제 크기 24×24';article.append(title,canvas,small);main.append(article);cards.push({id,canvas,ctx:canvas.getContext('2d'),image:null});}function paint(){const f=sequence[phase];document.querySelector('#frame').textContent=(f+1)+' / 4';for(const c of cards){c.ctx.clearRect(0,0,24,24);if(c.image?.complete&&c.image.naturalWidth)c.ctx.drawImage(c.image,f*24,0,24,24,0,0,24,24)}}function load(){const g=++generation;for(const c of cards){const image=new Image;image.onload=()=>{if(g!==generation)return;c.image=image;paint()};image.src=document.querySelector('#age').value+'/'+c.id+'-'+document.querySelector('#direction').value+'-sheet.png?v=20261012';}}document.querySelector('#age').onchange=load;document.querySelector('#direction').onchange=load;document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'일시정지':'재생'};document.querySelector('#next').onclick=()=>{playing=false;document.querySelector('#play').textContent='재생';phase=(phase+1)%sequence.length;paint()};setInterval(()=>{if(playing){phase=(phase+1)%sequence.length;paint()}},320);load();</script></html>
