<!doctype html><html lang="ko"><meta charset="utf-8"><title>부부 침대</title><style>body{background:#f5f0de;color:#65472f;font:16px system-ui;margin:24px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}section{background:#fff8e7;padding:16px;text-align:center;border:1px solid #dac59f}canvas,img{image-rendering:pixelated;width:192px}h1{font-size:24px}</style><h1>부부 침대 · 2×2칸</h1><p>기존 나무틀과 청록색 이불 · 베개 두 개 · 두 사람이 나란히 누울 공간</p><main><section><b>앞</b><br><img src="down.png?v=couple-1"><br><canvas width="32" height="32" data-sheet="down-rest-sheet.png"></canvas></section><section><b>뒤</b><br><img src="up.png?v=couple-1"><br><canvas width="32" height="32" data-sheet="up-rest-sheet.png"></canvas></section><section><b>왼쪽</b><br><img src="left.png?v=couple-1"><br><canvas width="32" height="32" data-sheet="left-rest-sheet.png"></canvas></section><section><b>오른쪽</b><br><img src="right.png?v=couple-1"><br><canvas width="32" height="32" data-sheet="right-rest-sheet.png"></canvas></section></main><script>for(const cv of document.querySelectorAll('canvas')){const im=new Image;im.src=cv.dataset.sheet+'?v=couple-1';const ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;let p=0;im.onload=()=>{setInterval(()=>{ctx.clearRect(0,0,32,32);ctx.drawImage(im,p*32,0,32,32,0,0,32,32);p=(p+1)%4},650)}}</script></html>
