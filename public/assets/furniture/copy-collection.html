<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>필사 수집 가구 40종 · 수정 모음</title><style>body{font:16px/1.6 system-ui;background:#eee4d4;color:#3b3028;margin:20px}header{position:sticky;top:0;background:#eee4d4ef;padding:10px;z-index:1}h1{font-size:23px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}article{padding:14px;background:#fff8ec;border-radius:12px}h2{font-size:17px}canvas{width:100%;image-rendering:pixelated;display:block}button,select,input{font:inherit;margin:4px}small{display:block}a{color:#70503d}</style><header><h1>필사 수집 가구 40종 · 비율/배치 수정 모음</h1><p>유아 5종 → 어린이 5종 → 나머지 30종 · 최초 장 완성 시 25%<br>38종은 정면 고정, 긴 낮잠자리·칸막이만 가로/세로 배치. 이유식상은 신생아가 아닌 걷는 유아 예시입니다.<br>가족·외형은 비교용 예시이며 저장·보상·앨범을 변경하지 않습니다.</p><label>보기 <select id="direction"><option value="cycle">가능한 방향만 자동</option><option value="front">정면</option><option value="side">옆면이 필요한 가구만</option></select></label><label>외형/가족 <select id="variant"><option value="example">기본 외형 · 단계에 맞는 아이/고양이</option><option value="alternate">다른 외형 · 옷장 아이/강아지</option><option value="empty">가족 없음 · 준비/정리</option></select></label><label>반려동물 <select id="petVariant"><option value="auto">외형 구성에 맞춤</option><option value="example">아기 고양이</option><option value="catadult">성체 고양이</option><option value="dogbaby">아기 강아지</option><option value="alternate">성체 강아지</option></select></label><button id="pause">일시정지</button><label>단계 <input id="phase" type="range" min="0" max="3" value="0"></label><span id="status"></span></header><main></main><script>
const items=[{"id":"copyBabyWash","name":"유아 씻기대","category":"infant","action":"물을 떠서 씻기고 수건으로 닦기","facings":["down"],"variants":["example","empty","alternate"]},{"id":"copyBabyMeal","name":"낮은 이유식상","category":"infant","action":"이유식을 떠서 먹이기","facings":["down"],"variants":["example","empty","alternate"]},{"id":"copyBabyNap","name":"천 덮개 낮잠자리","category":"infant","action":"눕히고 천 이불 덮기","facings":["down","right"],"variants":["example","empty","alternate"]},{"id":"copyBabyRail","name":"잡고 서는 난간","category":"infant","action":"난간을 잡고 일어섰다가 앉기","facings":["down"],"variants":["example","empty","alternate"]},{"id":"copyBabyBall","name":"천 공 놀이자리","category":"infant","action":"앉아서 천 공 밀기","facings":["down"],"variants":["example","empty","alternate"]},{"id":"copyChildPicture","name":"그림 맞추기 판","category":"child","action":"그림 조각 맞추기","facings":["down"],"variants":["example","empty","alternate"]},{"id":"copyChildShell","name":"조개 분류판","category":"child","action":"조개를 홈마다 분류하기","facings":["down"],"variants":["example","empty","alternate"]},{"id":"copyChildWater","name":"작은 물길 놀이대","category":"child","action":"물을 부어 수문 열기","facings":["down"],"variants":["example","empty","alternate"]},{"id":"copyChildPuppet","name":"천 인형극 무대","category":"child","action":"천 인형을 번갈아 올려 공연하기","facings":["down"],"variants":["example","empty","alternate"]},{"id":"copyChildBalance","name":"낮은 균형 디딤대","category":"child","action":"디딤판을 하나씩 건너기","facings":["down"],"variants":["example","empty","alternate"]},{"id":"copyStoneBath","name":"낮은 돌 욕조","category":"bath","action":"물 떠서 욕조에 붓기","facings":["down"],"variants":["example","empty","alternate"]},{"id":"copyFootBasin","name":"발 씻는 대야","category":"bath","action":"발을 담그고 물결 일으키기","facings":["down"],"variants":["example","empty","alternate"]},{"id":"copyPouringJar","name":"물 붓는 항아리대","category":"bath","action":"항아리를 기울여 물 따르기","facings":["down"],"variants":["example","empty","alternate"]},{"id":"copyBathStool","name":"목욕 걸상","category":"bath","action":"걸상에 앉아 수건 펼치기","facings":["down"],"variants":["example","empty","alternate"]},{"id":"copyStoneSink","name":"돌 세면대","category":"bath","action":"손을 씻고 물 털기","facings":["down"],"variants":["example","empty","alternate"]},{"id":"copyWarmJar","name":"온수 저장 항아리","category":"bath","action":"뚜껑을 열고 따뜻한 물 뜨기","facings":["down"],"variants":["example","empty","alternate"]},{"id":"copyClothesNiche","name":"옷 보관 벽감","category":"bath","action":"접은 천을 꺼내 정리하기","facings":["down"],"variants":["example","empty","alternate"]},{"id":"copyChangingScreen","name":"탈의 칸막이","category":"bath","action":"칸막이 천을 걷었다 내리기","facings":["down","right"],"variants":["example","empty","alternate"]},{"id":"copyBreadOven","name":"둥근 빵 화덕","category":"kitchen","action":"화덕에 빵을 넣고 꺼내기","facings":["down"],"variants":["example","empty","alternate"]},{"id":"copyStoneCounter","name":"돌 조리대","category":"kitchen","action":"채소를 올리고 썰어 모으기","facings":["down"],"variants":["example","empty","alternate"]},{"id":"copyClaySteamer","name":"토기 찜솥","category":"kitchen","action":"찜솥 뚜껑을 들어 김 빼기","facings":["down"],"variants":["example","empty","alternate"]},{"id":"copyVegetableBasin","name":"채소 씻는 수반","category":"kitchen","action":"채소를 흔들어 씻기","facings":["down"],"variants":["example","empty","alternate"]},{"id":"copyFoodDryer","name":"음식 건조틀","category":"kitchen","action":"건조틀에 식재료 널기","facings":["down"],"variants":["example","empty","alternate"]},{"id":"copyDishDrainer","name":"식기 물빼기대","category":"kitchen","action":"그릇을 씻어 엎어 놓기","facings":["down"],"variants":["example","empty","alternate"]},{"id":"copyFermentShelf","name":"발효 항아리장","category":"kitchen","action":"항아리 덮개를 열어 살피기","facings":["down"],"variants":["example","empty","alternate"]},{"id":"copyDrinkingStand","name":"식수 보관대","category":"kitchen","action":"잔에 물을 따라 내려놓기","facings":["down"],"variants":["example","empty","alternate"]},{"id":"copyPetArch","name":"아치형 잠자리","category":"pet","action":"잠자리에 들어가 몸을 둥글게 말기","facings":["down"],"variants":["example","empty","alternate","catadult","dogbaby"]},{"id":"copyPetJar","name":"항아리 숨숨집","category":"pet","action":"숨숨집에 들어갔다 고개 내밀기","facings":["down"],"variants":["example","empty","alternate","catadult","dogbaby"]},{"id":"copyPetSteps","name":"낮은 오르내림대","category":"pet","action":"낮은 계단 오르내리기","facings":["down"],"variants":["example","empty","alternate","catadult","dogbaby"]},{"id":"copyPetSand","name":"모래 파기 상자","category":"pet","action":"앞발로 모래 파기","facings":["down"],"variants":["example","empty","alternate","catadult","dogbaby"]},{"id":"copyPetBall","name":"공 굴리는 놀이판","category":"pet","action":"앞발로 홈 속 공 굴리기","facings":["down"],"variants":["example","empty","alternate","catadult","dogbaby"]},{"id":"copyPetWater","name":"돌 물그릇","category":"pet","action":"고개를 숙여 물 마시기","facings":["down"],"variants":["example","empty","alternate","catadult","dogbaby"]},{"id":"copyPetBath","name":"작은 목욕 대야","category":"pet","action":"얕은 대야에서 발 씻기","facings":["down"],"variants":["example","empty","alternate","catadult","dogbaby"]},{"id":"copyPetBrush","name":"빗질 받침","category":"pet","action":"등을 빗고 빗 털기","facings":["down"],"variants":["example","empty","alternate","catadult","dogbaby"]},{"id":"copySpringFlowers","name":"봄 들꽃 표본틀","category":"season","action":"표본틀을 열어 꽃잎 살펴보기","facings":["down"],"variants":["example","empty","alternate"]},{"id":"copySummerShells","name":"여름 조개 진열판","category":"season","action":"조개를 옮겨 진열하기","facings":["down"],"variants":["example","empty","alternate"]},{"id":"copyAutumnLeaves","name":"가을 낙엽 액자","category":"season","action":"낙엽 눌러 액자에 고정하기","facings":["down"],"variants":["example","empty","alternate"]},{"id":"copyWinterCones","name":"겨울 솔방울 장식대","category":"season","action":"솔방울 장식 돌려 살피기","facings":["down"],"variants":["example","empty","alternate"]},{"id":"copySeasonMosaic","name":"사계절 모자이크판","category":"season","action":"계절 타일 맞추기","facings":["down"],"variants":["example","empty","alternate"]},{"id":"copySeasonSand","name":"계절 풍경 모래판","category":"season","action":"모래판에 계절 풍경 그리기","facings":["down"],"variants":["example","empty","alternate"]}],version="00b3ec512aea";let paused=false,phase=0,direction=0,last=0,variant='example';const cards=items.map((item,i)=>{const article=document.createElement('article'),h=document.createElement('h2'),c=document.createElement('canvas'),p=document.createElement('p'),small=document.createElement('small');h.textContent=(i+1)+'. '+item.name;p.textContent=item.action;small.textContent=(item.category==='infant'?'1순위 · 유아':item.category==='child'?'2순위 · 어린이':'3순위 · 생활/전시')+' · '+(item.facings.length===1?'정면 고정 · 회전 없음':'가로/세로 배치');c.width=80;c.height=56;article.append(h,c,p,small);document.querySelector('main').append(article);const images={};for(const v of item.variants){const im=new Image;im.onload=()=>paint();im.src='copy-collection/'+item.id+'-'+v+'.png?v='+version;images[v]=im}return{c,images,item}});function paint(){for(const {c,images,item}of cards){const g=c.getContext('2d'),d=item.facings.length>1?direction:0;g.imageSmoothingEnabled=false;g.clearRect(0,0,80,56);const selected=item.category==='pet'&&document.querySelector('#petVariant').value!=='auto'?document.querySelector('#petVariant').value:variant;if(images[selected].complete)g.drawImage(images[selected],phase*96+8,d*96+24,80,56,0,0,80,56)}document.querySelector('#status').textContent=(direction?'가능한 옆면':'정면')+' · '+(phase+1)+'/4';document.querySelector('#phase').value=phase}document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'재생':'일시정지'};document.querySelector('#phase').oninput=e=>{paused=true;document.querySelector('#pause').textContent='재생';phase=+e.target.value;paint()};document.querySelector('#petVariant').onchange=()=>paint();document.querySelector('#variant').onchange=e=>{variant=e.target.value;paint()};document.querySelector('#direction').onchange=e=>{direction=e.target.value==='side'?1:0;paint()};function tick(ms){if(!paused&&ms-last>=650){phase=(phase+1)%4;if(phase===0&&document.querySelector('#direction').value==='cycle')direction=(direction+1)%2;last=ms;paint()}requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
