<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>정장·드레스 결혼식 착장 미리보기</title>
<style>body{max-width:800px;margin:24px auto;padding:16px;background:#ede7d8;color:#413d33;font:16px/1.7 system-ui}canvas{width:100%;height:auto;image-rendering:pixelated}label{display:inline-block;margin:8px}select,button{font:inherit;padding:8px}nav{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.line{background:#fff8e9;padding:16px;min-height:60px}a{color:#385b45}</style>
<h1>정장·드레스 착장 미리보기</h1><p>게임에서는 장날 ‘결혼 예복’에서 각180닢에 구매해요. 약혼자에게 선물하면 결혼식에 입고 오고, 내 예복은 결혼식 시작 전 가방에서 골라 입어요.</p>
<label>상대 <select id="partner"></select></label><label>내 옷 <select id="player"></select></label><label>상대 옷 <select id="outfit"></select></label>
<canvas width="320" height="220" aria-label="결혼 예복 모션 미리보기"></canvas><nav id="steps"></nav><p class="line" aria-live="polite"></p><p>저장·앨범을 변경하지 않는 착장 예시예요.</p><a href="wedding-outfits.html">복장 도트4종 비교</a> · <a href="/assets/events/index.html?q=결혼식">전체 결혼식 목록</a>
<script type="module">
import {drawDexterWedding} from '/src/render/dexter-wedding-art.ts';import {WEDDING_OUTFITS} from '/src/render/wedding-outfits.ts';import {withLookDefaults} from '/src/engine/avatar.ts';import neighbors from '/src/content/neighbors.json';import text from '/src/content/life-text.json';
const themes={rudy:'table',dexter:'sheep',postman:'invitations',marigold:'grapes',basil:'herbalTea',merchant:'patchwork',presser:'oliveCups',poppy:'banquetTea',juniper:'honeySpoons',cosmo:'fishPlatter',tilly:'forgedRings',wendell:'breadBoard',penelope:'wovenFlags'};
const partner=document.querySelector('#partner'),player=document.querySelector('#player'),outfit=document.querySelector('#outfit'),g=document.querySelector('canvas').getContext('2d');
for(const id of Object.keys(themes))partner.add(new Option(neighbors.find(n=>n.id===id).role,id));for(const a of WEDDING_OUTFITS){player.add(new Option(a.name,a.id));outfit.add(new Option(a.name,a.id))}player.value='bride-ball';outfit.value='groom-midnight';
let beat=0,start=performance.now();const actor=n=>({id:n.id,avatar:withLookDefaults({name:n.role,look:n.look??'m',...n.avatar}),who:n.avatar?'writer':n.sprite});
function stages(){const scene=text.scenes['wedding:'+partner.value];document.querySelector('#steps').replaceChildren(...scene.lines.map((line,i)=>{const b=document.createElement('button');b.textContent=`${i+1} · ${line.speaker==='narration'?'장면':neighbors.find(n=>n.id===line.speaker)?.role??'대화'}`;b.onclick=()=>{beat=i;start=performance.now();document.querySelector('.line').textContent=line.text};return b}));beat=0;start=performance.now();document.querySelector('.line').textContent=scene.lines[0].text}partner.onchange=stages;stages();
function frame(now){const n=neighbors.find(n=>n.id===partner.value),spouse=actor(n);spouse.avatar={...spouse.avatar,weddingOutfit:outfit.value};drawDexterWedding(g,320,220,(now-start)/1000,{...withLookDefaults({name:'기록자',look:'f',skin:3,hairBack:3}),weddingOutfit:player.value},spouse,neighbors.filter(n=>n.id!==partner.value).map(actor),beat,themes[partner.value]);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
